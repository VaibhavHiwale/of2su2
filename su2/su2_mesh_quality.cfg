% SU2 run that writes SU2's own mesh-quality output for an of2su2 mesh (1 iteration; compare with of2su2 --check --vtk)
SOLVER= EULER
MATH_PROBLEM= DIRECT
MACH_NUMBER= 0.1
AOA= 0.0
FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 288.15
REF_DIMENSIONALIZATION= DIMENSIONAL
MARKER_FAR= ( farfield )
MARKER_EULER= ( blade_wall, blade_root_cap, blade_tip_cap )
MARKER_PLOTTING= ( blade_wall )
MARKER_MONITORING= ( blade_wall )
NUM_METHOD_GRAD= GREEN_GAUSS
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= NO
TIME_DISCRE_FLOW= EULER_IMPLICIT
CFL_NUMBER= 1.0
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
ITER= 1
MESH_FILENAME= mesh.su2
MESH_FORMAT= SU2
OUTPUT_FILES= (RESTART_ASCII, PARAVIEW_ASCII)
VOLUME_OUTPUT= (COORDINATES, MESH_QUALITY)
VOLUME_FILENAME= flow
RESTART_FILENAME= restart
SCREEN_OUTPUT= (INNER_ITER, RMS_DENSITY)
